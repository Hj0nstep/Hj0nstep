<svg width="900" height="460" viewBox="0 0 900 460" xmlns="http://www.w3.org/2000/svg" font-family="'Segoe UI', Ubuntu, Sans-Serif">
  <title>APEX EV+ — interface interativa (clique pra abrir)</title>

  <rect x="0.5" y="0.5" width="899" height="459" rx="18" fill="#0a0a0d" stroke="#26262b" />

  <!-- eyebrow -->
  <rect x="28" y="26" width="230" height="24" rx="12" fill="rgba(217,164,65,0.13)" stroke="rgba(217,164,65,0.3)" />
  <circle cx="42" cy="38" r="3.5" fill="#4fd1a5" />
  <text x="52" y="42" font-size="10.5" letter-spacing="1" fill="#d9a441" font-family="'Cascadia Mono', Consolas, monospace">INTERFACE INTERATIVA</text>

  <!-- title -->
  <text x="28" y="112" font-size="52" font-weight="800" fill="#ededef" letter-spacing="-1">APEX <tspan fill="#d9a441">EV+</tspan></text>
  <text x="30" y="140" font-size="15.5" fill="#9a9aa2">Motor de decisão estatística para apostas esportivas ao vivo</text>

  <!-- stat strip -->
  <g font-family="'Cascadia Mono', Consolas, monospace">
    <line x1="28" y1="168" x2="872" y2="168" stroke="#1c1c21" />
    <text x="28"  y="196" font-size="24" font-weight="700" fill="#ededef">168</text>
    <text x="28"  y="214" font-size="10.5" fill="#5c5c64">TESTES AUTOMATIZADOS</text>

    <text x="240" y="196" font-size="24" font-weight="700" fill="#ededef">~80k</text>
    <text x="240" y="214" font-size="10.5" fill="#5c5c64">LINHAS DE PYTHON</text>

    <text x="452" y="196" font-size="24" font-weight="700" fill="#ededef">256.723</text>
    <text x="452" y="214" font-size="10.5" fill="#5c5c64">RATINGS DE ELO</text>

    <text x="664" y="196" font-size="24" font-weight="700" fill="#ededef">57,3%</text>
    <text x="664" y="214" font-size="10.5" fill="#5c5c64">ACERTO REAL (DECIDIDAS)</text>
    <line x1="28" y1="228" x2="872" y2="228" stroke="#1c1c21" />
  </g>

  <!-- mini board preview -->
  <text x="28" y="258" font-size="11" letter-spacing="1" fill="#5c5c64" font-family="'Cascadia Mono', Consolas, monospace">🔥 EM ANDAMENTO</text>

  <g font-family="'Cascadia Mono', Consolas, monospace">
    <!-- card 1 -->
    <rect x="28" y="270" width="270" height="86" rx="10" fill="#131316" stroke="#26262b" />
    <circle cx="44" cy="286" r="3" fill="#e2617b" />
    <text x="52" y="290" font-size="10" font-weight="700" fill="#e2617b">34' AO VIVO</text>
