    <rect x="312" y="270" width="270" height="86" rx="10" fill="#131316" stroke="#26262b" />
    <circle cx="328" cy="286" r="3" fill="#e2617b" />
    <text x="336" y="290" font-size="10" font-weight="700" fill="#e2617b">22' AO VIVO</text>
    <text x="326" y="312" font-size="13.5" font-weight="700" fill="#ededef" font-family="'Segoe UI',sans-serif">Man City x Liverpool</text>
    <text x="326" y="330" font-size="12" fill="#9a9aa2">0 — 0</text>
    <text x="326" y="348" font-size="11" fill="#9a9aa2">1X2 Casa · odd 2.30</text>
    <rect x="506" y="336" width="60" height="17" rx="9" fill="rgba(79,209,165,0.15)" />
    <text x="536" y="348" font-size="10" font-weight="700" fill="#4fd1a5" text-anchor="middle">EV +6.4%</text>

    <!-- card 3 -->
    <rect x="596" y="270" width="276" height="86" rx="10" fill="#131316" stroke="#26262b" />
    <circle cx="612" cy="286" r="3" fill="#e2617b" />
    <text x="620" y="290" font-size="10" font-weight="700" fill="#e2617b">78' AO VIVO</text>
    <text x="610" y="312" font-size="13.5" font-weight="700" fill="#ededef" font-family="'Segoe UI',sans-serif">Flamengo x Fluminense</text>
    <text x="610" y="330" font-size="12" fill="#9a9aa2">2 — 1</text>
    <text x="610" y="348" font-size="11" fill="#9a9aa2">BTTS Não · odd 1.65</text>
    <rect x="796" y="336" width="60" height="17" rx="9" fill="rgba(79,209,165,0.15)" />
    <text x="826" y="348" font-size="10" font-weight="700" fill="#4fd1a5" text-anchor="middle">EV +3.8%</text>
  </g>

  <!-- CTA -->
  <rect x="28" y="384" width="300" height="42" rx="8" fill="#d9a441" />
  <text x="178" y="410" font-size="14" font-weight="700" fill="#1a1408" text-anchor="middle" font-family="'Segoe UI',sans-serif">▶ Explorar a interface</text>
  <text x="28" y="448" font-size="11" fill="#5c5c64" font-family="'Cascadia Mono', Consolas, monospace">clique na imagem — jogos e odds são ilustrativos</text>
</svg>
