    <text x="42" y="330" font-size="12" fill="#9a9aa2">0 — 0</text>
    <text x="42" y="348" font-size="11" fill="#9a9aa2">Under 2.5 · odd 1.85</text>
    <rect x="222" y="336" width="60" height="17" rx="9" fill="rgba(226,97,123,0.15)" />
    <text x="252" y="348" font-size="10" font-weight="700" fill="#e2617b" text-anchor="middle">EV -2.1%</text>

