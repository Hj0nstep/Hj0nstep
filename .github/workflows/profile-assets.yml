name: Atualizar gráficos do perfil
on:
  workflow_dispatch:
  schedule:
    - cron: '23 9 * * *'
permissions:
  contents: write
concurrency:
  group: profile-assets
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Consultar dados e gerar imagens locais
        run: node scripts/update-profile.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Guardar somente imagens alteradas
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Atualiza gráficos locais do perfil'
            git push
          fi
